<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#05080c;font-family:-apple-system,Inter,sans-serif;color:#e7eef7;padding:20px}
.card{width:420px;background:#0d151d;border:1px solid #1e3349;border-radius:12px;padding:14px}
.h{display:flex;align-items:center;font-size:13px;font-weight:700;margin-bottom:12px}
.ranges{margin-left:auto;display:flex;background:#141f2b;border-radius:8px;padding:2px;font-size:11px;color:#8ea3b8}
.ranges span{padding:3px 9px;border-radius:6px}.ranges .on{background:#f7fafc;color:#0b1622;font-weight:700}
.banner{display:flex;align-items:baseline;gap:8px;background:#101d29;border:1px solid #24445f;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.big{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#7fd1ff;font-variant-numeric:tabular-nums}
.lab{font-size:11px;color:#8ea3b8}
.topup{margin-left:auto;font-size:11px;color:#8ea3b8;text-decoration:none;border-bottom:1px dotted #4a6b85;padding-bottom:1px}
.stats{display:flex;gap:8px;margin:8px 0 2px}
.stat{flex:1;border-top:1px solid #1e3349;padding-top:8px}
.stat .v{font-size:18px;font-weight:700}.stat .l{font-size:10px;color:#8ea3b8;margin-top:2px}
</style></head><body><div class="card">
<div class="h">Usage<span class="ranges"><span>6h</span><span>12h</span><span class="on">24h</span><span>48h</span></span></div>
<div class="banner"><span class="big">$8.99</span><span class="lab">Balance</span><a class="topup" href="#">Top up ↗</a></div>
<div class="stats"><div class="stat"><div class="v">$20.21</div><div class="l">Est. cost</div></div><div class="stat"><div class="v">6,529</div><div class="l">API requests</div></div><div class="stat"><div class="v">1.72B</div><div class="l">Tokens</div></div></div>
</div></body></html>
